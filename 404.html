<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Page Not Found - 404</title>
        <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fa;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .not-found-page #poop-layer {
            position: fixed;
            z-index: 0;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            padding: 20px;
        }
        h1 {
            font-size: 6rem;
            margin: 0;
            color: #ff4757;
        }
        h2 {
            font-size: 2rem;
            margin: 10px 0;
        }
        p {
            font-size: 1.1rem;
            color: #57606f;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #1e90ff;
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #1175db;
        }
    </style>
        <link rel="stylesheet" href="/GameDemo/404.css">
    </head>
    <body class="not-found-page">
        <div id="poop-layer" aria-hidden="true"></div>
        <div class="container">
            <h1>404</h1>
            <h2>Shits Broke Yo... Go check someplace else</h2>
            <p>Why you sneaking around in here. Turn back and go the other
                way.</p>
            <!-- The absolute path '/' ensures the home link works from any nested URL subfolder -->
            <a href="https://gabygarcia86.github.io/GameDemo/" class="btn">Back
                Home</a>
        </div>
        <script src="/GameDemo/404.js"></script>
        <script>
            const poopStorm = new PoopStorm(document.getElementById("poop-layer"));
            poopStorm.start();
            window.addEventListener("pagehide", () => poopStorm.stop());
            window.addEventListener("pageshow", (event) => {
                if (event.persisted) poopStorm.start();
            });
        </script>
    </body>
</html>
